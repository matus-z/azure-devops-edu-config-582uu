# =============================================================================
#  Kalkulačka poistenia — pipeline (konfiguračný repozitár)
#
#                            ┌─ 2 · Overenie ────────┐
#                            │                       │
#  ┌─ 1 · Build ────────┐    │                       │
#  │                    │    │ ┌───────────────────┐ │    ┌─ 3 · Publikovanie ──────┐
#  │ ┌────────────────┐ │    │ │ Automatické testy │ │    │                         │
#  │ │ version.json   │ │    │ └───────────────────┘ │    │ ┌─────────────────────┐ │
#  │ │ + tag → dist/  │ │───▶│   ‖ súbežne           │───▶│ │ artefakt `app`      │ │
#  │ └────────────────┘ │    │ ┌───────────────────┐ │    │ └─────────────────────┘ │
#  └────────────────────┘    │ │ Kontrola dokum.   │ │    └─────────────────────────┘
#                            │ └───────────────────┘ │                 │
#                            │                       │                 │
#                            └───────────────────────┘                 │
#          ┌───────────────────────────────────────────────────────────┘
#          │
#          │
#          ▼
#  ┌─ 4 · Staging ───────────────────┐    ┌─ 5 · Produkcia ─────────────────┐
#  │                                 │    │                                 │
#  │ ┌─────────────────────────────┐ │    │ ┌─────────────────────────────┐ │
#  │ │ Nasadenie na staging        │ │    │ │ Nasadenie do produkcie      │ │
#  │ └─────────────────────────────┘ │───▶│ └─────────────────────────────┘ │
#  │                                 │    │                                 │
#  │  brána: environment Staging     │    │  brána: environment Production  │
#  └─────────────────────────────────┘    └─────────────────────────────────┘
#
#  Verzia dodávateľa sa NEuvádza tu, ale vo `version.json` vedľa tohto súboru:
#      { "version": "v1.2.1" }
#
#  Dlhšie kroky nie sú inline — sú v `ci/*.sh`, aby sa dali spustiť a ladiť
#  aj lokálne, mimo pipeline. Inline ostáva len čítanie `version.json`, ktoré
#  nastavuje výstupnú premennú stage.
#
#  Prečo klonujeme skriptom a nie cez `resources.repositories`:
#  ref v `resources` sa vyhodnocuje pri kompilácii pipeline, takže sa nedá
#  načítať zo súboru. Chceme, aby zmena verzie bola zmenou v `version.json`
#  a nie zmenou pipeline — preto `git clone --branch <tag>`.
# =============================================================================

trigger: none          # spúšťame ručne — na workshope chceme vidieť, kto beh spustil
pr: none

pool:
  name: Pool1-Linux

variables:
  # Adresa repozitára dodávateľa na jednom mieste. Token v nej nie je — posiela
  # sa až pri klonovaní hlavičkou, aby sa nedostal do logu.
  vendorRepoUrl: https://adoserver.koop.sk/DefaultCollection/EDU/_git/EDU

  # PAT s rozsahom Code (Read) na repozitár dodávateľa sa TU NEDEFINUJE —
  # nastavuje sa ako tajná premenná `vendorPat` v nastaveniach pipeline
  # (Edit → Variables → Keep this value secret). Zámerne tu nie je ani prázdna
  # východisková hodnota: na ADO Serveri vie definícia z YAML prebiť tajnú
  # premennú z UI, a pipeline by potom klonovala bez tokenu.
  #
  # Prečo PAT a nie `System.AccessToken`: v projekte je zapnuté "Limit job
  # authorization scope to current repository", takže token jobu platí len pre
  # tento repozitár a klonovanie repozitára dodávateľa padne na TF401019.

stages:

# -----------------------------------------------------------------------------
# 1. BUILD — načíta verziu, stiahne kód dodávateľa na danom tagu, zostaví
# -----------------------------------------------------------------------------
- stage: Build
  displayName: Build
  jobs:
  - job: build
    displayName: Zostavenie aplikácie
    # Agenti v pooli sú vlastné stroje a workspace sa medzi behmi recykluje.
    # Bez tohto by `git clone ... vendor` pri druhom behu zlyhal na tom, že
    # priečinok už existuje — a `dist/` by ťahal staré súbory.
    workspace:
      clean: all
    steps:

    - checkout: self
      persistCredentials: true

    - bash: |
        set -euo pipefail
        if [ ! -f version.json ]; then
          echo "##vso[task.logissue type=error]version.json neexistuje"
          exit 1
        fi
        v="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' version.json | head -n 1)"
        if [ -z "$v" ]; then
          echo "##vso[task.logissue type=error]version.json neobsahuje 'version'"
          exit 1
        fi
        echo "Verzia dodávateľa: $v"
        echo "##vso[task.setvariable variable=appVersion;isOutput=true]$v"
        echo "##vso[build.addbuildtag]$v"
      name: readVersion
      displayName: Načítanie verzie z version.json

    # Ak tag neexistuje, tento krok zlyhá hlasne a hneď — to je dobré zlyhanie.
    - bash: bash ./ci/get-vendor-source.sh --url "$(vendorRepoUrl)" --tag "$(readVersion.appVersion)"
      env:
        VENDOR_TOKEN: $(vendorPat)
      displayName: Stiahnutie kódu dodávateľa (tag $(readVersion.appVersion))

    - bash: bash ./ci/build-package.sh --version "$(readVersion.appVersion)"
      displayName: Build — príprava dist/

    # Medzivýstup pre ďalšie stage. Ešte nie je overený, preto sa nevolá `app`.
    #
    # Používame staré build artefakty (file container), nie `publish`/`download`
    # (Pipeline Artifacts): tie Azure DevOps Server nepozná a krok zlyhá na
    # "Pipeline artifact is not supported in on-premises".
    - task: PublishBuildArtifacts@1
      displayName: Odovzdanie buildu ďalším stage
      inputs:
        pathToPublish: dist
        artifactName: build-output

# -----------------------------------------------------------------------------
# 2. VERIFY — dva joby bežia SÚBEŽNE (nemajú medzi sebou dependsOn)
# -----------------------------------------------------------------------------
- stage: Verify
  displayName: Overenie
  dependsOn: Build
  variables:
    appVersion: $[ stageDependencies.Build.build.outputs['readVersion.appVersion'] ]
  jobs:

  - job: test
    displayName: Automatické testy
    workspace:
      clean: all
    steps:
    # `self` (nie `none`) — z konfiguračného repozitára potrebujeme `ci/`.
    - checkout: self
    - task: DownloadBuildArtifacts@0
      displayName: Stiahnutie buildu
      inputs:
        buildType: current
        artifactName: build-output
        downloadPath: $(Agent.BuildDirectory)
    - bash: bash ./ci/get-vendor-source.sh --url "$(vendorRepoUrl)" --tag "$(appVersion)"
      env:
        VENDOR_TOKEN: $(vendorPat)
      displayName: Stiahnutie testov

    # Node sa nesťahuje: použije sa ten, ktorý je pribalený k agentovi.
    # `NodeTool@0` by ho ťahal z nodejs.org a za TLS proxy zlyhá na certifikáte.
    - bash: bash ./ci/use-agent-node.sh --minimum-major 20
      displayName: Node.js pribalený k agentovi

    # Overí, že na PATH je naozaj správna verzia.
    - bash: bash ./ci/test-node-version.sh --minimum-major 20
      displayName: Kontrola — Node.js na agentovi

    - bash: bash ./ci/run-vendor-tests.sh --package-path "$(Agent.BuildDirectory)/build-output"
      displayName: Spustenie testov

  - job: docs
    displayName: Kontrola dokumentácie
    workspace:
      clean: all
    steps:
    - checkout: self
    - bash: bash ./ci/test-documentation.sh --version "$(appVersion)"
      displayName: Dokumentácia zodpovedá nasadzovanej verzii

    - task: PublishBuildArtifacts@1
      displayName: Publikovanie dokumentácie
      inputs:
        pathToPublish: docs
        artifactName: docs

# -----------------------------------------------------------------------------
# 3. PUBLISH — až teraz vzniká artefakt, ktorý si schvaľovateľ stiahne.
#    Nič neoverené sa nepublikuje.
# -----------------------------------------------------------------------------
- stage: Publish
  displayName: Publikovanie artefaktu
  dependsOn: Verify
  jobs:
  - job: publish
    displayName: Publikovanie overeného balíka
    workspace:
      clean: all
    steps:
    - checkout: none
    - task: DownloadBuildArtifacts@0
      displayName: Stiahnutie overeného buildu
      inputs:
        buildType: current
        artifactName: build-output
        downloadPath: $(Agent.BuildDirectory)
    - task: PublishBuildArtifacts@1
      displayName: Artefakt `app` — na stiahnutie pri schvaľovaní
      inputs:
        pathToPublish: $(Agent.BuildDirectory)/build-output
        artifactName: app

# -----------------------------------------------------------------------------
# 4. STAGING — deployment job viazaný na prostredie `staging`
#    Schválenia a kontroly NIE SÚ tu; sú nastavené na prostredí.
# -----------------------------------------------------------------------------
- stage: Staging
  displayName: Nasadenie na staging
  dependsOn: Publish
  variables:
    appVersion: $[ stageDependencies.Build.build.outputs['readVersion.appVersion'] ]
  jobs:
  - deployment: deploy_staging
    displayName: Nasadenie na staging
    environment: Staging          # <- brána: schválenia a kontroly
    workspace:
      clean: all
    strategy:
      runOnce:
        deploy:
          steps:
          # deployment job sám o sebe repozitár nesťahuje — `ci/` si vypýtame.
          - checkout: self
          # Deployment job si štandardne sám stiahne pipeline artefakty — to
          # on-prem nefunguje, tak implicitné sťahovanie vypneme a artefakt
          # stiahneme klasickou úlohou.
          - download: none
          - task: DownloadBuildArtifacts@0
            displayName: Stiahnutie artefaktu app
            inputs:
              buildType: current
              artifactName: app
              downloadPath: $(Agent.BuildDirectory)
          # V ostrej prevádzke doplniť: --target-path /var/www/kalkulacka/staging
          - bash: bash ./ci/deploy-site.sh --version "$(appVersion)" --environment-name STAGING --package-path "$(Agent.BuildDirectory)/app"
            displayName: Kopírovanie na staging

# -----------------------------------------------------------------------------
# 5. PRODUKCIA — druhá brána, drahšia. Schvaľovateľ artefakt otvorí a overí.
# -----------------------------------------------------------------------------
- stage: Production
  displayName: Nasadenie do produkcie
  dependsOn: Staging
  variables:
    appVersion: $[ stageDependencies.Build.build.outputs['readVersion.appVersion'] ]
  jobs:
  - deployment: deploy_production
    displayName: Nasadenie do produkcie
    environment: Production       # <- brána: schválenia a kontroly
    workspace:
      clean: all
    strategy:
      runOnce:
        deploy:
          steps:
          # deployment job sám o sebe repozitár nesťahuje — `ci/` si vypýtame.
          - checkout: self
          # Deployment job si štandardne sám stiahne pipeline artefakty — to
          # on-prem nefunguje, tak implicitné sťahovanie vypneme a artefakt
          # stiahneme klasickou úlohou.
          - download: none
          - task: DownloadBuildArtifacts@0
            displayName: Stiahnutie artefaktu app
            inputs:
              buildType: current
              artifactName: app
              downloadPath: $(Agent.BuildDirectory)
          # V ostrej prevádzke doplniť: --target-path /var/www/kalkulacka/produkcia
          - bash: bash ./ci/deploy-site.sh --version "$(appVersion)" --environment-name PRODUKCIA --package-path "$(Agent.BuildDirectory)/app"
            displayName: Kopírovanie do produkcie
